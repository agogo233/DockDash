# GitHub Actions Docker 镜像构建发布标准模板（simple 档）
# 提炼自工作区各仓库 docker.yml / Adocker.yml 的统一骨架。
# 用法：复制到目标仓库 .github/workflows/docker.yml，按下方注释调整三处参数。
# 平台标准：仅 linux/amd64（如需 arm64，见 SKILL.md「多架构扩展」）。

name: "Publish Container Image"

on:
  push:
  workflow_dispatch:

permissions:
  actions: write # 仅供下方"清理旧 workflow runs"步骤使用
  contents: read
  packages: write # 推送镜像到 GHCR 必需

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 清理旧 workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3

      - name: 设置小写镜像名称和版本
        run: |
          CONTAINER_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "CONTAINER_NAME=$CONTAINER_NAME" >> $GITHUB_ENV
          LOWER_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWER_NAME=$LOWER_NAME" >> $GITHUB_ENV
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${GITHUB_SHA::8}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile # 【可调】仓库实际 Dockerfile 路径
          context: .
          platforms: linux/amd64 # 【可调】当前标准仅 amd64
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_NAME }}:latest
          build-args: |
            APP_REPO=${{ github.repository }}
            APP_VERSION=${{ env.VERSION }}

      - name: 清理未打标签的旧镜像版本
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.CONTAINER_NAME }}
          package-type: "container"
          min-versions-to-keep: 3
          delete-only-untagged-versions: "true"
